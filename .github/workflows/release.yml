name: 'Жизнь адна а стендоф два'

on:
  push:
    branches:
      - lab_1
      - feature/github_actions

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      
      - run: sudo apt-get update && sudo apt-get install libboost-test-dev -y
      
      - run: cmake . -DPATCH_VERSION=${{ github.run_number }}
      - run: cmake --build .
      - run: cmake --build . --target test
      - run: cmake --build . --target package
      
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: helloworld-linux
          path: helloworld-0.0.${{ github.run_number }}-Linux.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Install Boost
        run: |
          choco install -y boost-msvc-14.3
      
      - run: cmake . -DPATCH_VERSION=${{ github.run_number }}
      - run: cmake --build . --config Release
      - run: .\Release\helloworld.exe
      
      - name: Create ZIP package
        run: |
          mkdir -p helloworld-${{ github.run_number }}
          copy Release\helloworld_cli.exe helloworld-${{ github.run_number }}/
          7z a helloworld-0.0.${{ github.run_number }}-Windows.zip helloworld-${{ github.run_number }}/
      
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: helloworld-windows
          path: helloworld-0.0.${{ github.run_number }}-Windows.zip

  create-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: helloworld-linux
      
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: helloworld-windows
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
      
      - name: Upload Linux Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./helloworld-0.0.${{ github.run_number }}-Linux.deb
          asset_name: helloworld-0.0.${{ github.run_number }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package
      
      - name: Upload Windows Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./helloworld-0.0.${{ github.run_number }}-Windows.zip
          asset_name: helloworld-0.0.${{ github.run_number }}-Windows.zip
          asset_content_type: application/zip